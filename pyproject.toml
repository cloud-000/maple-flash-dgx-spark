[project]
name = "maple-run"
version = "0.1.0"
description = "Packed ternary CUDA runtime for DeepGrove Maple-Preview on DGX Spark"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "safetensors>=0.5.0",
    "huggingface-hub>=0.30.0",
    "numpy>=2.0.0",
]

[project.optional-dependencies]
cuda = [
    "torch==2.13.0",
    "triton==3.7.1",
]
tokenizer = [
    "transformers>=4.57.0",
]
eval = [
    "datasets>=3.0.0",
    "sympy>=1.13.0",
]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
maple-run = "maple_run.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
# Confirmed 2026-08-16 on this DGX Spark (GB10, sm_121, aarch64, CUDA 13.0):
# the host ComfyUI venv is torch 2.13.0+cu130 / triton 3.7.1. PyPI torch 2.13.0
# for manylinux aarch64 is the CUDA 13.0 build (cuda-toolkit / cudnn-cu13 /
# triton). Do not replace it with a CPU wheel.
